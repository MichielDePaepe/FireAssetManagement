name: ${PROJECT_NAME:-fire-asset-management}

services:
  api:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${PYTHON_PACKAGE:-config}.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py validate_production && python manage.py migrate --noinput && uvicorn ${PYTHON_PACKAGE:-config}.asgi:application --host 0.0.0.0 --port 8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${PYTHON_PACKAGE:-config}.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    command: ["celery", "-A", "${PYTHON_PACKAGE:-config}", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A ${PYTHON_PACKAGE:-config} inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${PYTHON_PACKAGE:-config}.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    command: ["celery", "-A", "${PYTHON_PACKAGE:-config}", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        APP_TITLE: ${APP_TITLE:-Fire Asset Management}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      target: production
    profiles: ["monitoring"]
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
      DJANGO_SETTINGS_MODULE: ${PYTHON_PACKAGE:-config}.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["sh", "-c", "if [ -z \"$${FLOWER_USER}\" ] || [ -z \"$${FLOWER_PASSWORD}\" ]; then echo 'Set FLOWER_USER and FLOWER_PASSWORD to enable production Flower.' >&2; exit 1; fi; exec celery -A ${PYTHON_PACKAGE:-config} flower --address=0.0.0.0 --port=5555 --basic-auth=\"$${FLOWER_USER}:$${FLOWER_PASSWORD}\""]
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5556}:5555"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
